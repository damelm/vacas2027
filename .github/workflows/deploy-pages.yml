name: Deploy a GitHub Pages

# Publica el frontend (modo estático con localStorage) en GitHub Pages.
# Requiere activar Pages una vez: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main, claude/beach-trip-savings-tracker-q3tlzs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Grupo por rama: un push a otra rama NO cancela el deploy en curso.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Solo la rama por defecto puede desplegar en Pages (a prueba de renombrados).
    # Las demás ramas se saltan el job (queda "skipped", sin cruz roja).
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del cliente
        working-directory: client
        run: npm ci

      - name: Build estático (localStorage) con base del repo
        working-directory: client
        env:
          VITE_STORAGE: local
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
